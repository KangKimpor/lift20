<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift20</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1219;--s:#181d2a;--s2:#242b3d;--t:#eef0f6;--m:#9aa2b8;--a:#8aa4ff;--on:#0b0f1a;--g:#ffc857;--ok:#6ee7b7;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f4f8;--s:#fff;--s2:#e4e8f2;--t:#151a26;--m:#5a627a;--a:#3450d0;--on:#fff;--g:#a86a00;--ok:#0b8a5f;color-scheme:light}}
:root[data-theme=light]{--bg:#f3f4f8;--s:#fff;--s2:#e4e8f2;--t:#151a26;--m:#5a627a;--a:#3450d0;--on:#fff;--g:#a86a00;--ok:#0b8a5f;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:500 16px/1.4 "Bricolage Grotesque",system-ui,sans-serif;overflow-x:hidden}
main{max-width:760px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:2.4rem;line-height:1.05;margin:.2em 0 .4em;font-weight:800;letter-spacing:-.02em}h2{margin:1.6em 0 .5em}h3{margin:0 0 .5em}
.m{color:var(--m);margin:.2em 0}.n{font-size:2.6rem;font-weight:800}
.card{background:var(--s);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 24px #0003}
.hero{background:linear-gradient(160deg,var(--s2),var(--s))}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.grid .card{margin:0}
button,select,a.big{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.big{display:block;width:100%;min-height:56px;margin-top:12px;border:0;border-radius:18px;background:var(--a);color:var(--on);font-weight:800;font-size:1.1rem;text-align:center;text-decoration:none;padding:15px;transition:transform .12s,background .2s}
.big:active{transform:scale(.97)}.big.ok{background:var(--ok)}
.ghost{min-height:48px;padding:0 16px;border:1px solid var(--s2);border-radius:14px;background:transparent}
.lnk{background:none;border:0;padding:12px 0;text-align:left;flex:1;font-weight:700;min-height:48px}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--s2)}.li:last-of-type{border:0}
ul.list{list-style:none;padding:0;margin:8px 0}ul.list li{display:flex;justify-content:space-between;padding:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}.chip{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--s2);background:var(--s)}.chip[aria-pressed=true]{background:var(--a);color:var(--on)}
label{display:block;color:var(--m)}select{display:block;width:100%;min-height:48px;margin-top:4px;background:var(--s);border:1px solid var(--s2);border-radius:12px;padding:0 10px}
.dots{display:flex;gap:8px}.dots span{flex:1;text-align:center;font-size:.8rem;color:var(--m)}.dots i{display:block;width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--s2);margin-bottom:4px}.dots .p i{border-color:var(--a)}.dots .d i{background:var(--ok);border-color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--s);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--s2);z-index:5}
nav button{flex:1;min-height:52px;background:none;border:0;border-radius:14px;color:var(--m);font-weight:700}nav button[aria-current=true]{color:var(--t);background:var(--s2)}
@media(min-width:900px){nav{top:0;right:auto;width:190px;flex-direction:column;gap:4px;padding:calc(20px + env(safe-area-inset-top,0px)) 10px;border:0}main{margin-left:190px;margin-right:auto;max-width:820px;padding-bottom:40px}}
#w{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#w>div{max-width:520px;margin:0 auto}#w[hidden]{display:none}
.wh{display:flex;align-items:center;gap:12px;color:var(--m)}.bar{height:6px;background:var(--s2);border-radius:9px;margin:10px 0 18px}.bar i{display:block;height:100%;background:var(--a);border-radius:9px;transition:width .4s}
.step{display:flex;align-items:center;justify-content:space-between;margin:18px 0 4px}.step button{width:72px;height:72px;border-radius:50%;border:0;background:var(--s2);font-size:2rem}.step output{font-size:4.5rem;font-weight:800}
.ring{position:relative;width:220px;margin:12px auto}.ring svg{width:100%}.ring circle{fill:none;stroke-width:7}.tr{stroke:var(--s2)}.pg{stroke:var(--a);stroke-linecap:round;transition:stroke-dashoffset .3s linear}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;font-weight:800}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px}.bars i{flex:1;background:var(--a);border-radius:8px 8px 0 0;min-height:4px}
dialog{width:min(520px,92vw);max-height:86vh;background:var(--s);color:var(--t);border:0;border-radius:24px;padding:20px}dialog::backdrop{background:#0009}
dialog ol{padding-left:20px}.pr{color:var(--g);font-weight:800}
.cf{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cf{display:none}}
</style></head><body>
<main id="app"></main>
<div id="w" hidden></div>
<dialog id="dlg"></dialog>
<nav aria-label="Main"><button data-a="nav" data-v="home">Home</button><button data-a="nav" data-v="prog">Workouts</button><button data-a="nav" data-v="ex">Exercises</button><button data-a="nav" data-v="stats">Progress</button><button data-a="nav" data-v="me">Profile</button></nav>
<script>
// ponytail: one file, no framework/build; string templates + one render(). Upgrade to a framework if screens outgrow this.
// ponytail: exercise data is one pipe-delimited block parsed once; move to JSON if it needs per-exercise video IDs.
const L=`dip|Dips|chest|push|dip|2|3|6|12|90|Support yourself on straight arms and lean forward slightly. Lower until shoulders pass just below elbows. Press back up. Keep elbows from flaring wide.
pu|Push-ups|chest|push|bw|1|3|8|15|75|Hands under shoulders, body in one straight line. Lower chest to just above the floor. Push up without sagging hips.
wpu|Wide Push-ups|chest|push|bw|1|3|8|15|75|Hands wider than shoulders. Lower with control. Press up and keep your body straight.
cgpu|Close-Grip Push-ups|triceps|push|bw|1|3|8|15|75|Hands just inside shoulder width. Keep elbows close to your ribs. Lower and press up.
dpu|Diamond Push-ups|triceps|push|bw|2|3|6|12|75|Thumbs and index fingers form a diamond. Lower chest to your hands. Keep elbows tucked.
dbfp|DB Floor Press|chest|push|db|1|3|10|15|60|Lie on the floor, knees bent. Lower until upper arms touch the floor. Press the dumbbells up.
dbsq|DB Squeeze Press|chest|push|db|1|3|10|15|60|Lie on the floor and press the dumbbells together the whole time. Lower to chest, press up while squeezing.
dbff|DB Floor Fly|chest|iso|db|1|3|10|15|60|Arms slightly bent. Open wide until elbows touch the floor. Squeeze your chest to bring the dumbbells together.
dbpo|DB Pullover|back|pull|db|1|3|10|15|60|Lie on the floor holding one dumbbell with both hands. Lower it behind your head with soft elbows. Pull it back over your chest.
ohrow|One-Arm DB Row|back|pull|db|1|3|10|15|60|Hinge forward with a flat back, free hand on your thigh. Pull the dumbbell to your hip and squeeze your shoulder blade. Lower slowly.
bor|DB Row (two arms)|back|pull|db|1|3|10|15|75|Hinge forward with a flat back. Row both dumbbells to your hips. Pause, then lower slowly.
shrug|DB Shrug|back|pull|db|1|3|12|20|45|Stand tall with dumbbells at your sides. Lift shoulders straight up. Hold one second, then lower.
rfly|DB Reverse Fly|shoulders|iso|db|1|3|12|20|45|Hinge forward, arms hanging down. Raise arms out to the sides, leading with elbows. Lower slowly.
sp|DB Shoulder Press|shoulders|push|db|1|3|8|12|90|Stand with dumbbells at shoulder height. Press overhead without arching your back. Lower with control.
arn|Arnold Press|shoulders|push|db|1|3|8|12|90|Start with palms facing you. Rotate palms forward as you press overhead. Reverse on the way down.
lat|DB Lateral Raise|shoulders|iso|db|1|3|12|20|45|Slight bend in the elbows. Raise arms to shoulder height. Lower in 3 seconds with no swinging.
llat|Leaning Lateral Raise|shoulders|iso|db|1|3|12|20|45|Hold a doorframe with one hand and lean away. Raise the dumbbell out to the side. Lower slowly.
yr|DB Y-Raise|shoulders|iso|db|1|3|12|20|45|Hinge forward slightly. Raise arms diagonally to form a Y, thumbs up. Lower slowly.
curl|DB Curl|biceps|iso|db|1|3|10|15|60|Elbows pinned to your sides. Curl up and squeeze. Lower in 3 seconds.
ham|Hammer Curl|biceps|iso|db|1|3|10|15|60|Palms face each other. Curl without moving your elbows. Lower slowly.
zot|Zottman Curl|biceps|iso|db|2|3|8|12|60|Curl with palms up. Rotate palms down at the top. Lower slowly, then rotate back.
oh|Overhead Triceps Extension|triceps|iso|db|1|3|10|15|60|Hold one dumbbell overhead with both hands. Lower behind your head, elbows pointing forward. Extend back up.
sk|DB Floor Skull Crusher|triceps|iso|db|1|3|10|15|60|Lie on the floor, arms up. Bend elbows to lower the dumbbells toward your head. Extend without moving your upper arms.
gob|Goblet Squat|legs|squat|db|1|3|10|15|90|Hold one dumbbell at your chest. Sit down between your knees with chest up. Drive through your whole foot to stand.
tsq|Tempo Squat|legs|squat|bw|1|3|8|12|75|Lower for 3 seconds, pause for one, then stand up fast. Knees track over toes.
sumo|DB Sumo Squat|legs|squat|db|1|3|10|15|75|Wide stance, toes out, dumbbell hanging between your legs. Squat deep and keep your chest up.
rdl|DB Romanian Deadlift|legs|hinge|db|1|3|10|15|90|Soft knees, dumbbells close to your legs. Push hips back until hamstrings stretch. Drive hips forward. Keep your back flat.
slrdl|Single-Leg RDL|legs|hinge|db|2|3|8|12|75|Balance on one leg and hinge forward. Free leg extends behind you. Return by squeezing your glute.
rl|Reverse Lunge|legs|lunge|db|1|3|8|12|90|Step back and lower your back knee toward the floor. Front heel stays down. Push through the front foot to return.
fl|Forward Lunge|legs|lunge|db|1|3|8|12|90|Step forward and lower until both knees bend about 90 degrees. Push back to the start.
gb|DB Glute Bridge|legs|hinge|db|1|3|12|20|60|Lie on your back with a dumbbell on your hips. Drive hips up and squeeze glutes. Lower slowly.
slgb|Single-Leg Glute Bridge|legs|hinge|bw|2|3|10|15|60|One foot on the floor, other leg extended. Drive hips up and keep them level.
calf|DB Calf Raise|legs|iso|db|1|3|12|20|45|Dumbbells at your sides. Rise high on your toes, pause, lower slowly.
dead|Dead Bug|core|core|bw|1|3|8|12|45|Lie on your back, arms up, knees at 90 degrees. Lower opposite arm and leg while your lower back stays pressed down.
rc|Reverse Crunch|core|core|bw|1|3|10|15|45|Lie on your back with knees bent. Curl hips off the floor toward your chest. Lower slowly.
bic|Bicycle Crunch|core|core|bw|1|3|12|20|45|Hands behind your head. Bring opposite elbow to knee, slowly. Don't pull on your neck.
rt|DB Russian Twist|core|core|db|1|3|12|20|45|Sit leaning back with feet down. Rotate the dumbbell side to side with your torso.
pup|Pull-ups|back|pull|bar|2|3|4|10|90|Hang with hands just past shoulder width. Pull chest toward the bar. Lower fully.
chin|Chin-ups|back|pull|bar|2|3|4|10|90|Palms facing you. Pull your chin over the bar. Lower slowly.
hkr|Hanging Knee Raise|core|core|bar|2|3|8|12|60|Hang from the bar. Raise knees to chest without swinging. Lower slowly.`;
const E={};L.split('\n').forEach(l=>{const[id,n,g,p,q,d,s,lo,hi,r,h]=l.split('|');E[id]={id,n,g,p,q,d:+d,s:+s,lo:+lo,hi:+hi,r:+r,h}});
const DAY=['A','B','C'],EQ={bw:'Bodyweight',db:'2 × 7 kg dumbbells',dip:'Dip station',bar:'Pull-up bar'};
const FM={full:['legs','chest','back','shoulders','core'],upper:['chest','back','shoulders','biceps','triceps'],lower:['legs','core'],chest:['chest','triceps'],back:['back','biceps'],shoulders:['shoulders'],arms:['biceps','triceps'],legs:['legs'],core:['core']};
const P=[['Quick full body','full',15],['Full body','full',25],['Upper body','upper',25],['Lower body','lower',20],['Chest + triceps','chest',20],['Back + biceps','back',20],['Shoulder focus','shoulders',15],['Arm focus','arms',15],['Core','core',10],['Quick 10','full',10]];
const K='lift20';let S;try{S=JSON.parse(localStorage[K])}catch{}
S=S||{prog:{A:['dip','gob','ohrow','rdl','curl'],B:['sp','rl','pu','bor','lat'],C:['dip','rdl','gob','sp','ham']},hist:[],eq:{dip:1,db:1,bar:0},pr:{}};
const save=()=>{try{localStorage[K]=JSON.stringify(S)}catch{alert('Storage is full or blocked. Progress will not survive a refresh.')}};
const av=i=>E[i].q=='bw'||S.eq[E[i].q];
const est=ids=>Math.round(ids.reduce((t,i)=>t+E[i].s*(30+E[i].r),0)/60);
const alts=(id,cur)=>Object.keys(E).filter(i=>av(i)&&i!=id&&E[i].g==E[id].g&&!cur.includes(i)).sort((a,b)=>(E[b].p==E[id].p)-(E[a].p==E[id].p));
const fix=()=>{for(const d of DAY)S.prog[d]=S.prog[d].map(i=>av(i)?i:(alts(i,S.prog[d])[0]||i))};
fix();
console.assert(Object.values(S.prog).flat().every(av)&&!Object.values(E).some(e=>/bulgarian|bench|step-up/i.test(e.n)),'program needs gear we do not own');
let v='home',F='all',B={f:'full',d:25},G=null,W=null,SW=null,T;
const $=s=>document.querySelector(s),app=$('#app'),w=$('#w'),dlg=$('#dlg');
const fmtD=d=>new Intl.DateTimeFormat(undefined,{weekday:'short',day:'numeric',month:'short'}).format(d);
const mon=()=>{const n=new Date();n.setHours(0,0,0,0);n.setDate(n.getDate()-((n.getDay()+6)%7));return +n};
const wkDone=()=>new Set(S.hist.filter(h=>h.d>=mon()).map(h=>(new Date(h.d).getDay()+6)%7));
// ponytail: streak = trailing run of workouts with gaps of 4 days or less; make it per-week if you want a stricter rule.
const streak=()=>{let n=0,p=Date.now();for(const h of [...S.hist].reverse()){if(p-h.d>4*864e5)break;n++;p=h.d}return n};
const week=()=>{const d=wkDone();return `<div class="dots">${'MTWTFSS'.split('').map((c,k)=>`<span class="${d.has(k)?'d':[0,2,4].includes(k)?'p':''}"><i></i>${c}${d.has(k)?'<b class="sr" hidden> done</b>':''}</span>`).join('')}</div>`};
const row=i=>`<div class="li"><button class="lnk" data-a="det" data-v="${i}">${E[i].n}</button><span class="m">${E[i].s}×${E[i].lo}–${E[i].hi}</span></div>`;

const home=()=>{const d=DAY[S.hist.filter(h=>h.day).length%3],ids=S.prog[d],hr=new Date().getHours(),last=S.hist.at(-1),b=ids.find(i=>S.pr[i]);
return `<p class="m">${hr<12?'Good morning':hr<18?'Good afternoon':'Good evening'}, Por</p><h1>Day ${d}</h1>
<div class="card hero"><p class="m">${ids.length} exercises, about ${est(ids)} min</p><ul class="list">${ids.map(i=>`<li>${E[i].n}<span class="m">${E[i].s}×${E[i].lo}–${E[i].hi}</span></li>`).join('')}</ul><button class="big" data-a="start" data-v="${d}">Start workout</button></div>
<div class="card"><h3>This week</h3>${week()}<p class="m">Outlined days are Mon, Wed, Fri.</p></div>
<div class="grid"><div class="card"><p class="m">Streak</p><span class="n">${streak()}</span> workouts</div>
<div class="card"><p class="m">Last workout</p>${last?`<b>${last.day?'Day '+last.day:'Custom'}</b>, ${last.dur} min<br><span class="m">${fmtD(last.d)}</span>`:'<span class="m">None yet</span>'}</div>
<div class="card"><p class="m">Next goal</p>${b?`Beat ${S.pr[b]} reps on ${E[b].n}`:'Finish your first workout to set records'}</div></div>`};

const plan=()=>`<h1>Workouts</h1><h2>My program</h2>${DAY.map(d=>`<div class="card"><h3>Day ${d}, about ${est(S.prog[d])} min</h3>${S.prog[d].map((i,k)=>`<div class="li"><button class="lnk" data-a="det" data-v="${i}">${E[i].n}</button><button class="ghost" data-a="swap" data-v="${d}${k}" aria-label="Swap ${E[i].n}">Swap</button></div>`).join('')}<button class="big" data-a="start" data-v="${d}">Start day ${d}</button></div>`).join('')}
<h2>Build a workout</h2><div class="chips">${P.map((p,k)=>`<button class="chip" data-a="pre" data-v="${k}">${p[0]}</button>`).join('')}</div>
<div class="row"><label>Focus<select data-k="f">${Object.keys(FM).map(f=>`<option ${f==B.f?'selected':''}>${f}</option>`).join('')}</select></label><label>Minutes<select data-k="d">${[10,15,20,25,30,40].map(d=>`<option ${d==B.d?'selected':''}>${d}</option>`).join('')}</select></label></div>
<button class="big" data-a="gen">Generate workout</button>
${G?`<div class="card"><h3>About ${est(G)} min</h3>${G.map(row).join('')}<div class="row"><button class="big" data-a="start" data-v="gen">Start</button><button class="ghost" data-a="gen">Shuffle</button><button class="ghost" data-a="clr">Reset to program</button></div></div>`:''}`;

const ex=()=>`<h1>Exercises</h1><div class="chips">${['all',...Object.keys(FM).slice(1,5).concat(['legs','core']).filter(x=>x!='lower')].map(g=>`<button class="chip" aria-pressed="${g==F}" data-a="filt" data-v="${g}">${g}</button>`).join('')}</div>
<div class="card">${Object.keys(E).filter(i=>F=='all'||E[i].g==F||(F=='upper'&&0)).map(i=>`<div class="li" style="${av(i)?'':'opacity:.5'}"><button class="lnk" data-a="det" data-v="${i}">${E[i].n}<br><span class="m">${E[i].g}, ${['','beginner','intermediate'][E[i].d]}${av(i)?'':', needs '+EQ[E[i].q].toLowerCase()}</span></button></div>`).join('')}</div>`;

const stats=()=>{const h=S.hist,sets=h.flatMap(x=>x.logs),m=mon(),wks=[5,4,3,2,1,0].map(k=>h.filter(x=>x.d>=m-k*6048e5&&x.d<m-(k-1)*6048e5).length);
return `<h1>Progress</h1><div class="grid"><div class="card"><p class="m">Workouts</p><span class="n">${h.length}</span></div><div class="card"><p class="m">Sets</p><span class="n">${sets.length}</span></div><div class="card"><p class="m">Total reps</p><span class="n">${sets.reduce((t,s)=>t+s.reps,0)}</span></div></div>
<div class="card"><h3>Workouts per week</h3><div class="bars" role="img" aria-label="Workouts in the last 6 weeks: ${wks.join(', ')}">${wks.map(n=>`<i style="height:${n*30+4}px" title="${n}"></i>`).join('')}</div></div>
<div class="card"><h3>Personal bests</h3>${Object.keys(S.pr).map(i=>`<div class="li"><span>${E[i].n}</span><b class="pr">${S.pr[i]} reps</b></div>`).join('')||'<p class="m">Your bests appear here after your first workout.</p>'}</div>
<div class="card"><h3>Recent</h3>${[...h].reverse().slice(0,8).map(x=>`<div class="li"><span>${x.day?'Day '+x.day:'Custom'}, ${x.logs.length} sets</span><span class="m">${fmtD(x.d)}, ${x.dur} min</span></div>`).join('')||'<p class="m">Nothing logged yet.</p>'}</div>`};

const me=()=>`<h1>Profile</h1><div class="card"><h3>Equipment</h3>${['dip','db','bar'].map(k=>`<label class="li" style="color:inherit;min-height:52px"><span>${EQ[k]}</span><input type="checkbox" style="width:26px;height:26px;flex:none" data-k="eq" value="${k}" ${S.eq[k]?'checked':''}></label>`).join('')}
<p class="m">Without the pull-up bar there is no vertical pulling, only rows and pullovers. Turning gear on or off updates your program and builder right away.</p></div>
<div class="card"><h3>Progression with fixed 7 kg dumbbells</h3><p>Add a rep each session until you hit the top of the range on every set. Then slow the lowering to 3 seconds, add a 1-second pause, or move to a harder version (two legs to one, wider push-up to close-grip). Cut rest only on small accessory lifts.</p></div>
<div class="card"><h3>Data</h3><p class="m">Everything is stored on this device.</p><button class="ghost" data-a="reset">Erase all data</button></div>`;
const V={home,prog:plan,ex,stats,me};
const render=()=>{app.innerHTML=V[v]();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v==v))};

const show=h=>{dlg.innerHTML=h+'<form method="dialog"><button class="big">Close</button></form>';dlg.showModal()};
const det=id=>{const e=E[id];return `<h2>${e.n}</h2><p class="m">${e.g}, ${['','beginner','intermediate'][e.d]}, ${EQ[e.q]}${av(id)?'':' (turn it on in Profile)'}</p><p><b>${e.s} sets × ${e.lo}–${e.hi} reps</b>, rest ${e.r}s</p><ol>${e.h.split('. ').map(x=>`<li>${x.replace(/\.$/,'')}.</li>`).join('')}</ol><p class="m">Progress: add a rep each session until ${e.hi} on every set, then slow the lowering to 3 seconds.</p><a class="big" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.n+' proper form')}" target="_blank" rel="noopener">Find a tutorial on YouTube</a>`};
const swapUI=(id,cur)=>{const c=alts(id,cur);return `<h2>Swap ${E[id].n}</h2>${c.length?c.map(i=>`<div class="li"><button class="lnk" data-a="pick" data-v="${i}">${E[i].n}<br><span class="m">${E[i].p==E[id].p?'Same movement':'Same muscle'}, ${E[i].s}×${E[i].lo}–${E[i].hi}, ${EQ[E[i].q]}</span></button></div>`).join(''):'<p class="m">No other exercises for this muscle with your equipment.</p>'}`};

const build=(f,d)=>{const gs=FM[f],n=Math.max(2,Math.round(d/5.5)),out=[];
for(let k=0;out.length<n&&k<n*4;k++){const c=Object.keys(E).filter(i=>av(i)&&E[i].g==gs[k%gs.length]&&!out.includes(i)),f2=c.filter(i=>!out.some(o=>E[o].g==E[i].g&&E[o].p==E[i].p)),a=f2.length?f2:c;if(a.length)out.push(a[Math.random()*a.length|0])}
const iso=i=>E[i].p=='iso'||E[i].g=='core';out.sort((a,b)=>iso(a)-iso(b));while(est(out)>d+3&&out.length>2)out.pop();return out};

const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const recalc=()=>{W.total=W.ids.reduce((t,i)=>t+E[i].s,0)};
const wk=()=>{if(!W){w.hidden=true;return}w.hidden=false;
if(W.fin){const by={};W.logs.forEach(l=>(by[l.id]=by[l.id]||[]).push(l.reps));
w.innerHTML=`<div><h1>Workout complete</h1><div class="grid"><div class="card"><span class="n">${W.fin}</span> min</div><div class="card"><span class="n">${W.logs.length}</span> sets</div><div class="card"><span class="n">${W.logs.reduce((t,l)=>t+l.reps,0)}</span> reps</div></div>
<div class="card"><h3>Highlights</h3>${Object.keys(by).map(i=>`<div class="li"><span>${E[i].n}</span><b>${by[i].join(' / ')}</b></div>`).join('')}</div>
${W.prs.size?`<div class="card"><h3 class="pr">New personal bests</h3>${[...W.prs].map(i=>`<p>${E[i].n}: ${W.best[i]} reps</p>`).join('')}</div>`:''}
<p class="m">This week: ${wkDone().size} of 3 workouts</p><button class="big" data-a="close">Done</button></div>`;
for(let k=0;k<26;k++){const s=document.createElement('i');s.className='cf';s.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360} 80% 65%);animation-delay:${Math.random()*.5}s`;w.append(s);setTimeout(()=>s.remove(),2600)}return}
const id=W.ids[W.i],e=E[id],r=W.rest;
w.innerHTML=`<div><div class="wh"><button class="ghost" data-a="quit" aria-label="End workout">✕</button><span>Exercise ${W.i+1} of ${W.ids.length}</span></div><div class="bar"><i style="width:${W.logs.length/W.total*100}%"></i></div>
<h1>${e.n}</h1><p class="m">Target ${e.s} × ${e.lo}–${e.hi}, set ${W.s+1} of ${e.s}${S.pr[id]?`, best ${S.pr[id]}`:''}</p>`+
(r?`<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tr" cx="60" cy="60" r="54"/><circle class="pg" id="rg" cx="60" cy="60" r="54" stroke-dasharray="339.3" transform="rotate(-90 60 60)"/></svg><b id="rt" role="timer">${fmt(r.left)}</b></div>
<div class="row"><button class="ghost" data-a="rt" data-v="-15">−15s</button><button class="ghost" data-a="rp" id="rpb">${r.pause?'Resume':'Pause'}</button><button class="ghost" data-a="rt" data-v="15">+15s</button></div><button class="big" id="nx" data-a="next">${r.over?'Next set':'Skip rest'}</button>`
:`<div class="step"><button data-a="rep" data-v="-1" aria-label="One fewer rep">−</button><output id="rv" aria-live="polite">${W.reps}</output><button data-a="rep" data-v="1" aria-label="One more rep">+</button></div><p class="m" style="text-align:center">reps this set</p><button class="big" id="cs" data-a="done">Complete set</button>`)+
`<div class="row" style="margin-top:14px"><button class="ghost" data-a="howw">How to</button><button class="ghost" data-a="sww">Swap</button></div></div>`;
if(r)ring()};
const ring=()=>{const r=W&&W.rest;if(!r||!$('#rg'))return;$('#rg').style.strokeDashoffset=339.3*(1-r.left/r.tot);$('#rt').textContent=fmt(r.left);$('#nx').textContent=r.over?'Next set':'Skip rest'};
const beep=()=>{try{navigator.vibrate&&navigator.vibrate(200);const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=660;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch{}};
const tick=()=>{clearInterval(T);T=setInterval(()=>{const r=W&&W.rest;if(!r||r.pause||r.over)return;r.left=Math.max(0,Math.ceil((r.end-Date.now())/1e3));if(!r.left){r.over=1;beep()}ring()},250)};
const fin=()=>{clearInterval(T);for(const k in W.best)S.pr[k]=Math.max(S.pr[k]||0,W.best[k]);const dur=Math.max(1,Math.round((Date.now()-W.start)/6e4));S.hist.push({d:Date.now(),dur,day:W.day,logs:W.logs});save();W.fin=dur;W.rest=null;wk()};
// ponytail: an in-progress workout lives in memory only; a refresh mid-session loses it (finished sessions are saved).

const act={
nav(x){v=x;render();scrollTo(0,0)},filt(x){F=x;render()},det:id=>show(det(id)),
swap(x){const d=x[0],i=+x.slice(1);SW={day:d,i};show(swapUI(S.prog[d][i],S.prog[d]))},
sww(){const id=W.ids[W.i];SW={w:1,day:W.day,i:W.i};show(swapUI(id,W.ids))},
pick(n){if(SW.w){W.ids[W.i]=n;W.s=Math.min(W.s,E[n].s-1);W.reps=E[n].lo;recalc()}if(SW.day){S.prog[SW.day][SW.i]=n;save()}dlg.close();SW.w?wk():render()},
pre(k){B.f=P[k][1];B.d=P[k][2];act.gen()},gen(){G=build(B.f,B.d);render()},clr(){G=null;render()},
start(x){const ids=x=='gen'?[...G]:[...S.prog[x]];W={ids,day:x=='gen'?0:x,i:0,s:0,reps:E[ids[0]].lo,logs:[],best:{},prs:new Set,start:Date.now()};recalc();wk()},
how:id=>show(det(id)),howw(){show(det(W.ids[W.i]))},
rep(x){W.reps=Math.max(0,W.reps+ +x);$('#rv').textContent=W.reps},
done(){if(W.busy)return;W.busy=1;const e=E[W.ids[W.i]],r=W.reps,b=Math.max(S.pr[e.id]||0,W.best[e.id]||0),pr=S.pr[e.id]&&r>b;
W.best[e.id]=Math.max(b,r);W.logs.push({id:e.id,reps:r});if(pr)W.prs.add(e.id);
const c=$('#cs');c.textContent=pr?'New personal best!':'✓ Set complete';c.classList.add('ok');
setTimeout(()=>{W.busy=0;const last=W.s+1>=e.s;if(last&&W.i+1>=W.ids.length)return fin();
if(last){W.s=0;W.i++;W.reps=E[W.ids[W.i]].lo}else W.s++;
W.rest={left:e.r,tot:e.r,end:Date.now()+e.r*1e3};wk();tick()},550)},
rt(x){const r=W.rest;x=+x;r.tot=Math.max(15,r.tot+x);if(r.pause)r.left=Math.max(1,r.left+x);else{r.end+=x*1e3;r.left=Math.max(1,Math.ceil((r.end-Date.now())/1e3))}r.over=0;ring()},
rp(){const r=W.rest;if(r.pause){r.pause=0;r.end=Date.now()+r.left*1e3}else r.pause=1;$('#rpb').textContent=r.pause?'Resume':'Pause'},
next(){W.rest=null;wk()},
quit(){if(confirm('End this workout? Sets so far will not be saved.')){clearInterval(T);W=null;wk()}},
close(){W=null;wk();v='home';render()},
reset(){if(confirm('Erase all workouts, records and settings?')){try{localStorage.removeItem(K)}catch{}location.reload()}}};
document.onclick=e=>{const b=e.target.closest('[data-a]');if(b)act[b.dataset.a](b.dataset.v)};
document.onchange=e=>{const t=e.target,k=t.dataset.k;if(k=='eq'){S.eq[t.value]=t.checked?1:0;fix();save();render()}else if(k)B[k]=k=='d'?+t.value:t.value};
render();
</script></body></html>

  else if(show){scrollGuide.classList.add('visible');clearTimeout(scrollFade);scrollFade=setTimeout(()=>scrollGuide.classList.remove('visible'),700)}
  if(scrollFrame)return;
  scrollFrame=requestAnimationFrame(()=>{
    scrollFrame=0;const scroller=w.hidden?document.scrollingElement:w,range=scroller.scrollHeight-scroller.clientHeight;
    scrollGuide.hidden=!touchScroll.matches||range<=1||!$('#lg').hidden;
    if(scrollGuide.hidden)return;
    const vp=visualViewport;scrollGuide.style.top=`calc(${vp?.offsetTop||0}px + var(--safe-top) + 8px)`;
    scrollGuide.style.bottom=`calc(${Math.max(0,innerHeight-(vp?.height||innerHeight)-(vp?.offsetTop||0))}px + var(--safe-bottom) + 8px)`;
    const track=scrollGuide.clientHeight,size=Math.min(track,Math.max(24,track*Math.min(scroller.clientHeight,vp?.height||innerHeight)/scroller.scrollHeight));
    scrollGuide.firstElementChild.style.cssText=`height:${size}px;transform:translateY(${Math.max(0,Math.min(1,scroller.scrollTop/range))*(track-size)}px)`;
  });
};
